# Nginx Configuration for ThynkSuccess
# This file will be used as the reverse proxy configuration

upstream website {
    server website-frontend:3000;
}

upstream pulse {
    server pulse-frontend:3001;
}

upstream schooling {
    server schooling-frontend:3002;
}

server {
    listen 80;
    server_name thynksuccess.com www.thynksuccess.com;

    location / {
        proxy_pass http://website;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name pulse.thynksuccess.com;

    location / {
        proxy_pass http://pulse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name schooling.thynksuccess.com;

    location / {
        proxy_pass http://schooling;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
